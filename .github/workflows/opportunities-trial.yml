name: Opportunities trial run (branch only)
on:
  push:
    branches: ['opportunities/**']
    paths: ['scripts/opportunities/**', '.github/workflows/opportunities-trial.yml']
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect (no commit, no deploy)
        run: python3 scripts/opportunities/collect.py --report
      - uses: actions/upload-artifact@v4
        with:
          name: opportunities-trial
          path: data/opportunities.json
