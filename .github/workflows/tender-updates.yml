name: Update tender sources
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_tenders.py'
      - '.github/workflows/tender-updates.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tender-source-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Check public funding sources
        id: collect
        continue-on-error: true
        run: python3 scripts/update_tenders.py
      - name: Save source checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This is a disposable Actions checkout. On a race, rebuild the
          # generated JSON from the latest committed data rather than merging it.
          for attempt in 1 2 3; do
            git add data/tender-updates.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update tender source checks'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Could not save source checks after three attempts' >&2
              exit 1
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/update_tenders.py
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
