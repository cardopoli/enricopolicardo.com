name: Update tender sources
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_tenders.py'
      - '.github/workflows/tender-updates.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tender-source-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check public funding sources
        id: collect
        continue-on-error: true
        run: python3 scripts/update_tenders.py
      - name: Save source checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tender-updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update tender source checks'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
