recipe('rice-peas',['Riso con piselli e ricotta','Rice with peas and ricotta'],'main',ALL,25,pan,[['rice',80],['peas',150],['ricotta',80],['oil',5],['salt',0.5]],[["Porta a bollore una pentola d’acqua e aggiungi poco sale. Versa il riso e controlla il tempo sulla confezione.","Bring a pan of water to the boil and add a little salt. Add the rice and check its packet cooking time."],["Aggiungi i piselli quando manca il loro tempo di cottura alla fine del riso; segui la confezione.","Add the peas when their packet cooking time remains on the rice timer."],["Scola bene. Rimetti in pentola e mescola con ricotta e olio. Servi subito.","Drain well. Return to the pan and stir in the ricotta and oil. Serve straight away."]],'dairy');
recipe('chicken-carrot',['Pollo, carote e pane','Chicken, carrots and bread'],'main',ALL,25,fry,[['chicken',120],['carrot',200],['bread',70],['oil',10],['salt',0.5]],[["Lava le carote e tagliale a fettine sottili. Lava mani e utensili dopo aver toccato il pollo crudo.","Wash the carrots and slice thinly. Wash hands and utensils after handling raw chicken."],["Metti le carote in padella con olio e 4 cucchiai d’acqua a persona. Copri e cuoci per 8 minuti.","Put the carrots in the pan with the oil and 4 tablespoons of water per person. Cover and cook for 8 minutes."],["Aggiungi il pollo a striscioline. Cuoci per circa 10-12 minuti, girandolo e aggiungendo acqua se serve.","Add the chicken strips. Cook for about 10-12 minutes, turning them and adding water if needed."],["Controlla con un termometro che il centro del pollo raggiunga 75°C per 30 secondi; prolunga la cottura se necessario. Servi con poco sale e il pane.","Use a food thermometer to check the centre of the chicken reaches 75°C for 30 seconds; cook longer if needed. Serve with a little salt and the bread."]],'meat',['Un termometro da cucina rende più facile controllare il pollo. Non lavare il pollo crudo.','A food thermometer makes checking chicken easier. Do not wash raw chicken.']);
recipe('cod-tomato',['Merluzzo al pomodoro con pane','Cod in tomato sauce with bread'],'main',ALL,25,fry,[['cod',150],['passata',200],['carrot',100],['bread',70],['oil',10],['salt',0.5]],[["Lava la carota e tagliala a fettine molto sottili. Mettila in padella con passata, olio e 4 cucchiai d’acqua a persona.","Wash and very thinly slice the carrot. Put it in the pan with the passata, oil and 4 tablespoons of water per person."],["Fai bollire piano per 5 minuti. Aggiungi i filetti ancora surgelati solo se la confezione prevede questo metodo.","Simmer for 5 minutes. Add the frozen fillets only if the packet allows cooking from frozen."],["Copri e cuoci seguendo il tempo sulla confezione, circa 15-20 minuti. Il pesce deve essere ben caldo al centro, opaco e dividersi facilmente.","Cover and follow the packet time, about 15-20 minutes. The fish must be hot through, opaque and flake easily."],["Controlla eventuali spine prima di servire. Aggiungi poco sale e servi con il pane.","Check for any bones before serving. Add a little salt and serve with the bread."]],'fish',['Scegli filetti adatti alla cottura da surgelati; altrimenti scongelali in frigorifero prima.','Choose fillets suitable for cooking from frozen; otherwise defrost in the fridge first.']);
recipe('tuna-potato',['Patate, tonno e fagiolini','Potatoes, tuna and green beans'],'main',['primavera','estate'],25,pan,[['potato',250],['tuna',80],['greenbeans',200],['oil',10],['salt',0.5]],[["Lava e pela le patate, poi tagliale a cubetti di 2 cm. Lava i fagiolini e togli le estremità.","Wash and peel the potatoes, then cut into 2 cm cubes. Wash and trim the green beans."],["Metti le patate in acqua bollente. Dopo 5 minuti aggiungi i fagiolini e cuoci altri 10-12 minuti, finché tutto è tenero.","Put the potatoes in boiling water. After 5 minutes add the beans and cook for another 10-12 minutes, until tender."],["Scola, unisci il tonno scolato, l’olio e poco sale. Servi tiepido.","Drain, add the drained tuna, oil and a little salt. Serve warm."]],'fish');
recipe('mackerel-carrot',['Sgombro, carote e pane','Mackerel, carrots and bread'],'main',ALL,20,pan,[['mackerel',100],['carrot',200],['bread',70],['oil',5]],[["Lava le carote e tagliale a fettine. Lessale per 12-15 minuti, finché sono tenere.","Wash and slice the carrots. Boil for 12-15 minutes, until tender."],["Scola lo sgombro e controlla eventuali spine. Scola le carote e condisci con l’olio.","Drain the mackerel and check for any bones. Drain the carrots and dress with the oil."],["Servi lo sgombro con le carote tiepide e il pane. Non serve aggiungere sale.","Serve the mackerel with the warm carrots and bread. No added salt is needed."]],'fish');
recipe('eggs-spinach',['Uova ben cotte, spinaci e pane','Fully cooked eggs, spinach and bread'],'main',ALL,20,fry,[['eggs',2],['spinach',200],['bread',70],['oil',10],['salt',0.5]],[["Cuoci gli spinaci in padella con poca acqua, seguendo la confezione. Fai evaporare l’acqua in eccesso.","Cook the spinach in the pan with a little water, following the packet. Let excess water evaporate."],["Aggiungi l’olio. Sbatti le uova in una ciotola con poco sale e versale sugli spinaci.","Add the oil. Beat the eggs in a bowl with a little salt and pour over the spinach."],["Cuoci a fuoco basso, mescolando per 4-6 minuti, finché non rimane uovo liquido. Servi subito con il pane.","Cook over a low heat, stirring for 4-6 minutes, until no liquid egg remains. Serve straight away with the bread."]],'eggs');
recipe('pasta-broccoli',['Pasta, broccoli e ceci','Pasta with broccoli and chickpeas'],'main',['autunno','inverno','primavera'],25,pan,[['pasta',70],['broccoli',200],['chickpeas',150],['oil',10],['salt',0.5]],[["Lava i broccoli e dividili in pezzetti piccoli. Scola e sciacqua i ceci.","Wash the broccoli and cut into small pieces. Drain and rinse the chickpeas."],["Cuoci la pasta in acqua bollente con poco sale. Aggiungi i broccoli quando mancano 8 minuti alla fine.","Cook the pasta in boiling water with a little salt. Add the broccoli with 8 minutes of cooking time left."],["Aggiungi i ceci negli ultimi 3 minuti. Scola quando pasta e broccoli sono teneri, tenendo da parte poca acqua.","Add the chickpeas for the final 3 minutes. Drain when pasta and broccoli are tender, keeping a little cooking water."],["Condisci con l’olio e poca acqua di cottura. Schiaccia leggermente i ceci con la forchetta se preferisci.","Stir in the oil and a little cooking water. Lightly mash the chickpeas with a fork if preferred."]],'legumes');
recipe('minestrone',['Minestra di verdure e fagioli','Vegetable and bean soup'],'main',ALL,25,pan,[['mixed',250],['beans',150],['pasta',50],['oil',10],['salt',0.5]],[rinse,["Metti le verdure surgelate e 500 ml d’acqua a persona in pentola. Porta a bollore e cuoci secondo la confezione.","Put the frozen vegetables and 500 ml water per person in a saucepan. Bring to the boil and cook according to the packet."],["Aggiungi la pasta quando manca il suo tempo di cottura alla fine delle verdure. Unisci i fagioli negli ultimi 5 minuti.","Add the pasta when its cooking time remains on the vegetables. Add the beans for the last 5 minutes."],["Controlla che tutto sia tenero, aggiungi olio e poco sale. Servi caldo.","Check everything is tender, add the oil and a little salt. Serve hot."]],'legumes');
recipe('ricotta-spinach',['Ricotta, spinaci e pane','Ricotta, spinach and bread'],'main',ALL,15,pan,[['ricotta',120],['spinach',200],['bread',80],['oil',10],['salt',0.5]],[["Cuoci gli spinaci con poca acqua seguendo la confezione. Scolali bene.","Cook the spinach with a little water following the packet. Drain well."],["Condisci gli spinaci con olio e poco sale. Servi con ricotta e pane.","Dress the spinach with the oil and a little salt. Serve with the ricotta and bread."]],'dairy');
recipe('tomato-mozzarella',['Pomodori, mozzarella e pane','Tomatoes, mozzarella and bread'],'main',['estate'],10,['Piatto e coltello','Plate and knife'],[['tomato',250],['mozzarella',100],['bread',80],['oil',10]],[["Lava i pomodori e tagliali a pezzetti. Scola la mozzarella e tagliala.","Wash and chop the tomatoes. Drain and slice the mozzarella."],["Metti tutto nel piatto con l’olio e servi con il pane.","Arrange on a plate with the oil and serve with the bread."]],'dairy');
recipe('pumpkin-chickpeas',['Zucca e ceci con pane','Pumpkin and chickpeas with bread'],'main',['autunno','inverno'],25,pan,[['pumpkin',250],['chickpeas',150],['bread',70],['oil',10],['salt',0.5]],[rinse,["Taglia la zucca a cubetti di 2 cm. Mettila in pentola con 200 ml d’acqua a persona. Copri e cuoci per 15 minuti.","Cut the pumpkin into 2 cm cubes. Put it in a pan with 200 ml water per person. Cover and cook for 15 minutes."],["Aggiungi i ceci e cuoci altri 5 minuti. Schiaccia una parte con la forchetta, lasciando il resto a pezzetti.","Add the chickpeas and cook for another 5 minutes. Mash some with a fork and leave the rest in pieces."],["Aggiungi olio e poco sale, poi servi con il pane.","Add the oil and a little salt, then serve with the bread."]],'legumes');
recipe('cabbage-beans',['Verza e fagioli con polenta','Savoy cabbage and beans with polenta'],'main',['autunno','inverno'],25,both,[['cabbage',200],['beans',150],['polenta',60],['oil',10],['salt',0.5]],[["Lava la verza e tagliala a strisce sottili. Mettila in padella con mezzo bicchiere d’acqua a persona. Copri e cuoci per 15 minuti.","Wash the cabbage and slice thinly. Put it in a frying pan with half a glass of water per person. Cover and cook for 15 minutes."],["Scola e sciacqua i fagioli. Uniscili alla verza con l’olio e poco sale, poi scalda per 5 minuti.","Drain and rinse the beans. Add to the cabbage with the oil and a little salt, then heat for 5 minutes."],["Intanto prepara la polenta istantanea con l’acqua e i tempi indicati sulla confezione. Mescola bene.","Meanwhile, make the instant polenta using the water quantity and cooking time on its packet. Stir well."],["Servi verza e fagioli sopra la polenta.","Serve the cabbage and beans over the polenta."]],'legumes');
recipe('pumpkin-eggs',['Uova, zucca e pane','Eggs, pumpkin and bread'],'main',['autunno','inverno'],25,fry,[['eggs',2],['pumpkin',200],['bread',70],['oil',10],['salt',0.5]],[["Taglia la zucca a cubetti di 1 cm. Mettila in padella con olio e mezzo bicchiere d’acqua a persona.","Cut the pumpkin into 1 cm cubes. Put it in the pan with the oil and half a glass of water per person."],["Copri e cuoci per 12-15 minuti, finché è tenera. Aggiungi poca acqua se asciuga.","Cover and cook for 12-15 minutes, until tender. Add a little water if it dries out."],["Sbatti le uova con poco sale, versale sulla zucca e mescola a fuoco basso per 4-6 minuti: non deve rimanere uovo liquido.","Beat the eggs with a little salt, pour over the pumpkin and stir over a low heat for 4-6 minutes: no liquid egg should remain."],["Servi subito con il pane.","Serve straight away with the bread."]],'eggs');
recipe('chicken-cabbage',['Pollo e verza con pane','Chicken and cabbage with bread'],'main',['autunno','inverno'],25,fry,[['chicken',120],['cabbage',200],['bread',70],['oil',10],['salt',0.5]],[["Lava la verza e tagliala sottile. Mettila in padella con olio e mezzo bicchiere d’acqua a persona. Copri e cuoci per 10 minuti.","Wash and thinly slice the cabbage. Put it in the pan with the oil and half a glass of water per person. Cover and cook for 10 minutes."],["Aggiungi il pollo a striscioline. Lava mani e utensili dopo aver toccato il pollo crudo.","Add the chicken strips. Wash hands and utensils after handling raw chicken."],["Cuoci per circa 10-12 minuti, mescolando. Controlla con un termometro che il centro del pollo raggiunga 75°C per 30 secondi; prolunga la cottura se serve.","Cook for about 10-12 minutes, stirring. Use a thermometer to check the centre of the chicken reaches 75°C for 30 seconds; cook longer if needed."],["Aggiungi poco sale e servi con il pane.","Add a little salt and serve with the bread."]],'meat');
recipe('rice-lentils',['Riso, lenticchie e carote','Rice, lentils and carrots'],'main',ALL,25,pan,[['rice',70],['lentils',150],['carrot',200],['oil',10],['salt',0.5]],[["Lava le carote e tagliale a dadini piccoli. Scola e sciacqua le lenticchie.","Wash and finely dice the carrots. Drain and rinse the lentils."],["Metti il riso e le carote in acqua bollente con poco sale. Cuoci secondo il tempo del riso sulla confezione.","Put the rice and carrots in boiling water with a little salt. Cook for the rice packet time."],["Aggiungi le lenticchie negli ultimi 5 minuti. Scola quando tutto è tenero, poi aggiungi l’olio e servi subito.","Add the lentils for the last 5 minutes. Drain when everything is tender, then add the oil and serve straight away."]],'legumes');
recipe('pasta-courgette',['Pasta, zucchine e ricotta','Pasta, courgettes and ricotta'],'main',['primavera','estate'],25,both,[['pasta',80],['courgette',200],['ricotta',100],['oil',10],['salt',0.5]],[["Lava le zucchine e tagliale a fettine sottili. Cuocile in padella con olio e 4 cucchiai d’acqua a persona, coperte, per 12-15 minuti.","Wash and thinly slice the courgettes. Cook in the covered pan with the oil and 4 tablespoons of water per person for 12-15 minutes."],["Intanto cuoci la pasta in acqua bollente con poco sale, seguendo la confezione.","Meanwhile, cook the pasta in boiling water with a little salt, following the packet."],["Scola, tenendo poca acqua di cottura. Mescola pasta, zucchine e ricotta, aggiungendo acqua per rendere il tutto morbido.","Drain, keeping a little cooking water. Mix the pasta, courgettes and ricotta, adding water to loosen."]],'dairy');
recipe('peas-eggs',['Uova e piselli con pane','Eggs and peas with bread'],'main',['primavera','estate'],20,fry,[['eggs',2],['peas',200],['bread',70],['oil',10],['salt',0.5]],[["Metti i piselli in padella con poca acqua. Copri e cuoci seguendo la confezione.","Put the peas in a pan with a little water. Cover and cook following the packet."],["Fai evaporare l’acqua in eccesso e aggiungi l’olio. Sbatti le uova con poco sale e versale in padella.","Let excess water evaporate and add the oil. Beat the eggs with a little salt and pour into the pan."],["Mescola a fuoco basso per 4-6 minuti, finché non rimane uovo liquido. Servi con il pane.","Stir over a low heat for 4-6 minutes, until no liquid egg remains. Serve with the bread."]],'eggs');
recipe('beans-tomato',['Fagioli al pomodoro con pane','Beans in tomato sauce with bread'],'main',ALL,15,pan,[['beans',150],['passata',200],['bread',80],['oil',10],['salt',0.5]],[rinse,["Metti passata e fagioli in pentola con 4 cucchiai d’acqua a persona. Cuoci a fuoco basso per 10 minuti, mescolando.","Put the passata and beans in a pan with 4 tablespoons of water per person. Cook gently for 10 minutes, stirring."],["Aggiungi olio e poco sale. Servi con il pane.","Add the oil and a little salt. Serve with the bread."]],'legumes');
recipe('tuna-spinach',['Pasta con tonno e spinaci','Pasta with tuna and spinach'],'main',ALL,20,both,[['pasta',80],['tuna',80],['spinach',200],['oil',10]],[["Cuoci gli spinaci in padella con poca acqua, seguendo la confezione.","Cook the spinach in a pan with a little water, following the packet."],["Intanto cuoci la pasta in acqua bollente, seguendo la confezione. Non serve aggiungere sale.","Meanwhile, cook the pasta in boiling water following the packet. No added salt is needed."],["Scola il tonno e uniscilo agli spinaci. Scalda per 3 minuti.","Drain the tuna and add it to the spinach. Heat for 3 minutes."],["Scola la pasta, uniscila agli spinaci e al tonno, aggiungi l’olio e mescola.","Drain the pasta, add to the spinach and tuna, then stir in the oil."]],'fish');
recipe('chicken-courgette',['Pollo e zucchine con pane','Chicken and courgettes with bread'],'main',['primavera','estate'],25,fry,[['chicken',120],['courgette',200],['bread',70],['oil',10],['salt',0.5]],[["Lava le zucchine, tagliale sottili e mettile in padella con olio e 4 cucchiai d’acqua a persona. Copri e cuoci per 8 minuti.","Wash and thinly slice the courgettes. Put in the pan with the oil and 4 tablespoons of water per person. Cover and cook for 8 minutes."],["Aggiungi il pollo. Lava mani e utensili dopo aver toccato il pollo crudo.","Add the chicken. Wash hands and utensils after handling raw chicken."],["Cuoci per circa 10-12 minuti, girando il pollo. Controlla con un termometro che il centro raggiunga 75°C per 30 secondi; continua la cottura se serve.","Cook for about 10-12 minutes, turning the chicken. Use a thermometer to check the centre reaches 75°C for 30 seconds; cook longer if needed."],["Aggiungi poco sale e servi con il pane.","Add a little salt and serve with the bread."]],'meat');
recipe('chickpeas-courgette',['Ceci e zucchine con riso','Chickpeas and courgettes with rice'],'main',['primavera','estate'],25,both,[['chickpeas',150],['courgette',200],['rice',70],['oil',10],['salt',0.5]],[["Cuoci il riso in acqua bollente con poco sale, seguendo la confezione.","Cook the rice in boiling water with a little salt, following the packet."],["Intanto lava e taglia le zucchine a fettine sottili. Cuocile in padella con olio e mezzo bicchiere d’acqua a persona per 12 minuti.","Meanwhile, wash and thinly slice the courgettes. Cook in a pan with the oil and half a glass of water per person for 12 minutes."],["Scola e sciacqua i ceci, aggiungili alle zucchine e scalda per altri 5 minuti.","Drain and rinse the chickpeas, add to the courgettes and heat for another 5 minutes."],["Scola il riso e servi tutto insieme, ben caldo.","Drain the rice and serve everything together, hot."]],'legumes');
recipe('broccoli-potato',['Patate, broccoli e ricotta','Potatoes, broccoli and ricotta'],'main',['autunno','inverno','primavera'],25,pan,[['potato',250],['broccoli',200],['ricotta',120],['oil',10],['salt',0.5]],[["Lava e pela le patate, poi tagliale a cubetti di 2 cm. Lava i broccoli e tagliali a pezzetti.","Wash and peel the potatoes, then cut into 2 cm cubes. Wash and chop the broccoli."],["Metti le patate in acqua bollente con poco sale. Dopo 5 minuti aggiungi i broccoli e cuoci altri 10 minuti, finché tutto è tenero.","Put the potatoes in boiling water with a little salt. After 5 minutes add the broccoli and cook for another 10 minutes, until tender."],["Scola e schiaccia leggermente con la forchetta. Aggiungi olio e ricotta e servi caldo.","Drain and lightly mash with a fork. Stir in the oil and ricotta and serve hot."]],'dairy');
recipe('polenta-beans',['Polenta con fagioli al pomodoro','Polenta with beans in tomato sauce'],'main',ALL,20,both,[['polenta',70],['beans',150],['passata',200],['oil',10],['salt',0.5]],[rinse,["Scalda fagioli e passata in padella con poca acqua per 10 minuti, mescolando.","Heat the beans and passata in a pan with a little water for 10 minutes, stirring."],["Intanto cuoci la polenta istantanea con l’acqua e i tempi indicati sulla confezione.","Meanwhile, cook the instant polenta with the water quantity and time stated on its packet."],["Aggiungi olio e poco sale ai fagioli e servili sopra la polenta.","Add the oil and a little salt to the beans and serve over the polenta."]],'legumes');

function validateBackup(d){const library=validateLibrary(d?.library||{foods:{},recipes:[]});if(!d||d.schema!==1||!['it','en'].includes(d.lang)||!ALL.includes(d.season)||!Number.isInteger(d.people)||d.people<1||d.people>6||typeof d.weeks!=='object'||!d.weeks||Array.isArray(d.weeks)||Object.keys(d.weeks).length>200)throw Error('Invalid backup');for(const [week,plan]of Object.entries(d.weeks)){if(!validWeek(week)||!Array.isArray(plan)||plan.length!==7)throw Error('Invalid week');for(const day of plan){if(!day||typeof day!=='object')throw Error('Invalid day');for(const meal of MEALS){const id=day[meal];const r=library.recipes.find(r=>r.id===id)||RECIPES.find(r=>BASE_RECIPE_IDS.includes(r.id)&&r.id===id);if(id!==null&&(!r||(meal==='colazione'?r.meal!=='colazione':r.meal!=='main')))throw Error('Invalid meal');}}}return {schema:1,lang:d.lang,season:d.season,people:d.people,weeks:d.weeks,dryPulses:d.dryPulses!==false,preferBatch:d.preferBatch!==false,library};}

function shoppingTotals(){const map={};for(const day of selectedDays){for(const m of MEALS){const r=getR(plan()[day][m]);if(r)for(const [k,q]of r.items)map[k]=(map[k]||0)+q*state.people;}if(extraFruit&&MEALS.some(m=>plan()[day][m]))map[fruitKey()]=(map[fruitKey()]||0)+300*state.people;}if(state.dryPulses)for(const k of PULSES)if(map[k])map[k]=dryQuantity(map[k]);return map;}

function renderShopping(){const totals=shoppingTotals();const totalKeys=Object.keys(totals);$('#shopping').innerHTML=`<h2 class="print-title">${W().shoppingFor} · ${weekLabel()} · ${state.people} ${personLabel()}</h2><div class="toolbar"><div><h2>${W().shopping}</h2><p class="muted smalltext" style="margin-top:8px;margin-bottom:0">${weekLabel()} · ${state.people} ${personLabel()}</p></div><div class="row"><button class="small" data-export="shopping-txt">${W().txt}</button><button class="small" data-export="shopping-print">${W().print}</button><button class="small" data-export="shopping-share">${W().share}</button></div></div><p class="muted">${W().shoppingIntro}</p><p class="notice">${state.dryPulses?W().dryModeNote+' '+W().yieldNote:W().cannedMode}</p><div class="shopping-layout"><div>${totalKeys.length?['produce','chilled','frozen','cupboard','pantry'].map(g=>{const keys=totalKeys.filter(k=>FOOD[k].g===g).sort((a,b)=>shoppingName(a).localeCompare(shoppingName(b),state.lang));if(!keys.length)return '';return `<section class="shopping-group"><h3>${W()[g]}</h3>${keys.map(k=>`<label class="check-row"><input type="checkbox" data-buy="${k}" ${checked.has(checkKey(k,totals[k]))?'checked':''}><span>${shoppingName(k)}</span><b>${qty(k,totals[k])}</b></label>`).join('')}</section>`;}).join(''):`<div class="empty">${selectedDays.size?W().listEmpty:W().noDay}</div>`}<p class="smalltext muted">${W().estimated} ${W().pantryNote}</p></div><aside class="no-print"><div class="aside-box white"><h3>${W().days}</h3><button class="small" id="allDays">${W().allDays}</button>${Array.from({length:7},(_,i)=>`<label class="check-row date-pick"><input type="checkbox" data-day="${i}" ${selectedDays.has(i)?'checked':''}><span>${fmtDate(i)}</span></label>`).join('')}</div><div class="aside-box" style="margin-top:18px"><label class="check-row"><input id="fruitExtra" type="checkbox" ${extraFruit?'checked':''}><span>${W().extras}</span></label><p class="smalltext" style="margin-bottom:0">${W().extrasNote}</p></div></aside></div>`;$$('[data-day]').forEach(c=>c.onchange=()=>{c.checked?selectedDays.add(Number(c.dataset.day)):selectedDays.delete(Number(c.dataset.day));renderShopping();});$('#allDays').onclick=()=>{selectedDays=new Set([0,1,2,3,4,5,6]);renderShopping();};$('#fruitExtra').onchange=e=>{extraFruit=e.target.checked;renderShopping();};$$('[data-buy]').forEach(c=>c.onchange=()=>{const key=checkKey(c.dataset.buy,totals[c.dataset.buy]);c.checked?checked.add(key):checked.delete(key);});bindExport();}
function recipeText(r){return L(r.n)+'\n'+r.time+' '+W().minutes+' · '+state.people+' '+personLabel()+'\n'+W().equipment+': '+L(r.equipment)+'\n\n'+W().ingredients+'\n'+ingredientsText(r).map(i=>'- '+i).join('\n')+'\n\n'+W().method+'\n'+r.steps.map((s,i)=>(i+1)+'. '+cookingStep(s)).join('\n')+(L(r.note)?'\n\n'+L(r.note):'')+'\n\n'+W().drained+(state.dryPulses&&r.items.some(i=>PULSES.includes(i[0]))?'\n'+W().batchRecipeNote:'');}
function weekText(){const p=plan();const unique=[...new Set(p.flatMap(day=>MEALS.map(m=>day[m])).filter(Boolean))];return W().brand+'\n'+W().savedPlan+' · '+weekLabel()+'\n'+state.people+' '+personLabel()+'\n'+W().exportNote+'\n\n'+p.map((day,i)=>fmtDate(i).toUpperCase()+'\n'+MEALS.map(m=>W()[m]+': '+(getR(day[m])?L(getR(day[m]).n):'-')).join('\n')).join('\n\n')+'\n\n'+W().water+'\n'+(extraFruit?W().extrasNote:'')+'\n\n'+batchText()+'\n\n'+W().recipes.toUpperCase()+'\n\n'+unique.map(id=>recipeText(getR(id))).join('\n\n--------------------\n\n')+'\n\n'+W().noteTiming+'\n\n'+W().guideSafetyText+'\n'+W().leftoversText;}
function shoppingText(){const totals=shoppingTotals();return W().brand+'\n'+W().shoppingFor+' · '+weekLabel()+'\n'+state.people+' '+personLabel()+'\n'+W().days+': '+[...selectedDays].sort().map(i=>fmtDate(i,{weekday:'short',day:'numeric'})).join(', ')+'\n\n'+['produce','chilled','frozen','cupboard','pantry'].map(g=>{const ks=Object.keys(totals).filter(k=>FOOD[k].g===g);return ks.length?W()[g].toUpperCase()+'\n'+ks.map(k=>(checked.has(checkKey(k,totals[k]))?'[x] ':'[ ] ')+shoppingName(k)+' - '+qty(k,totals[k])).join('\n'):'';}).filter(Boolean).join('\n\n')+'\n\n'+(state.dryPulses?W().dryModeNote+' '+W().yieldNote:W().cannedMode)+'\n'+W().estimated+'\n'+W().drained+'\n'+(extraFruit?W().optionalFruit+': '+W().extrasNote:'');}
function download(text,name,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(W().downloaded);}
async function shareText(text,name){const f=new File([text],name,{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:W().brand});}else if(navigator.share){await navigator.share({title:W().brand,text});}else{download(text,name,'text/plain;charset=utf-8');toast(W().shareUnavailable);}}catch(e){if(e.name!=='AbortError'){download(text,name,'text/plain;charset=utf-8');toast(W().shareUnavailable);}}}
function bindExport(){$$('[data-export]').forEach(b=>b.onclick=()=>{const [kind,format]=b.dataset.export.split('-');const text=kind==='week'?weekText():kind==='batch'?batchText():shoppingText();const name='pasto-semplice-'+kind+'-'+week+'-'+state.lang+'.txt';if(format==='print')window.print();else if(format==='share')shareText(text,name);else download(text,name,'text/plain;charset=utf-8');});}
function renderGuide(){$('#guide').innerHTML=`<div class="sources"><button class="small" id="backGuide">← ${W().back}</button><p class="eyebrow" style="margin-top:25px">${W().guide}</p><h2>${W().guideTitle}</h2><p>${W().guideIntro}</p>${[['guideFood','guideFoodText'],['guideBudget','guideBudgetText'],['guideSafety','guideSafetyText'],['leftovers','leftoversText']].map(([a,b])=>`<details open><summary>${W()[a]}</summary><p>${W()[b]}</p></details>`).join('')}<p class="muted">${W().seasonNote}</p><p class="muted">${W().storage}</p><h3>${W().sources}</h3><p>${W().sourceNote}</p><ul><li><a href="https://www.crea.gov.it/web/alimenti-e-nutrizione/-/linee-guida-per-una-sana-alimentazione-2018" target="_blank" rel="noopener">CREA - ${state.lang==='it'?'Linee guida per una sana alimentazione':'Italian healthy eating guidelines'}</a></li><li><a href="https://www.salute.gov.it/new/it/tema/sistema-di-controllo-della-sicurezza-alimentare/sicurezza-domestica-degli-alimenti/" target="_blank" rel="noopener">${state.lang==='it'?'Ministero della Salute - Sicurezza domestica degli alimenti':'Italian Ministry of Health - Food safety at home'}</a></li><li><a href="https://www.gov.uk/government/publications/cooking-your-food/cooking-your-food" target="_blank" rel="noopener">Food Standards Agency - ${state.lang==='it'?'Temperature e cottura':'Cooking temperatures and food safety'}</a></li></ul></div>`;$('#backGuide').onclick=()=>switchTab('week');}

Object.assign(WORDS.it,{batch:'In anticipo',batchTitle:'Cuoci una volta, prepara più pasti.',batchIntro:'Le quantità qui sotto vengono dal piano salvato. Prepara le basi, dividile in porzioni e congela quelle per i giorni successivi.',batchPrefer:'Preferisci piatti da preparare in anticipo',batchPreferNote:'Vale per le nuove proposte; il piano già salvato non cambia.',dryMode:'Usa legumi secchi da cuocere in anticipo',dryModeNote:'La spesa mostra il peso secco. Le ricette usano sempre legumi già cotti: non aggiungere legumi secchi direttamente ai piatti veloci.',cannedMode:'Con questa scelta la spesa usa legumi in scatola, pesati scolati.',batchPulses:'Legumi per questa settimana',batchDishes:'Piatti e basi da preparare',batchView:'Apri le preparazioni',dryBuy:'Da comprare, secchi (circa)',cookedNeed:'Da ottenere, cotti e scolati',batchPortions:'porzioni da 150 g',yieldNote:'Stima: 100 g secchi danno circa 250 g cotti e scolati. Il risultato varia: la spesa arrotonda in alto a 25 g. Pesa sempre il risultato cotto e aggiungi una piccola quantità già cotta se manca.',prepTime:'I tempi dei piatti veloci partono da legumi già cotti. Ammollo e bollitura sono preparazioni separate, più lunghe di 30 minuti.',beanTime:'Fagioli: 8-12 ore di ammollo; circa 60-120 minuti di cottura totale.',chickpeaTime:'Ceci: 8-12 ore di ammollo; circa 60-120 minuti di cottura totale.',lentilTime:'Lenticchie intere: segui la confezione per l’ammollo; circa 30-45 minuti di cottura, fino a completa morbidezza.',pulseMethod:'Come cuocere i legumi secchi',pulseSteps:['Controlla i legumi ed elimina eventuali sassolini; sciacquali. Metti fagioli e ceci in abbondante acqua in frigorifero per 8-12 ore. Per le lenticchie intere segui la confezione.','Butta l’acqua di ammollo e sciacqua. Metti ogni tipo in una pentola separata con acqua fresca che lo copra di almeno 5 cm.','Porta a bollore e mantieni una vera bollitura per almeno 30 minuti, aggiungendo acqua calda se serve. Per i fagioli rossi questo passaggio è essenziale: non usare solo una cottura lenta a bassa temperatura.','Continua la cottura finché i legumi sono completamente morbidi e si schiacciano facilmente con una forchetta; segui la confezione se richiede più tempo. Aggiungi il pomodoro solo dopo la cottura.','Scola e pesa. Dividi in contenitori bassi da 150 g o nelle quantità indicate dalle ricette. Etichetta con nome, peso e data, raffredda rapidamente e conserva come indicato sotto.'],batchStorage:'Frigorifero, freezer e riscaldamento',batchStorageText:'Metti in frigorifero entro 2 ore, prima se fa caldo. Tieni solo le porzioni per le prossime 48 ore a 4°C o meno; congela subito le altre, senza aspettare il giorno previsto nel menu. Scongela in frigorifero e usa entro 24 ore dallo scongelamento completo. Riscalda una sola volta, finché il centro è ben caldo. Per chi inizia, è più semplice cuocere riso, pasta e polenta al momento; il riso avanzato va raffreddato entro un’ora e usato entro 24 ore in frigorifero.',batchUse:'Userai queste porzioni in',batchTotal:'Porzioni totali da preparare',batchIngredients:'Ingredienti per tutte queste porzioni',batchFresh:'Da cuocere al momento',batchEmpty:'Aggiungi un piatto con legumi al piano per vedere le quantità.',batchNoDishes:'Il piano non contiene basi o piatti contrassegnati per la preparazione in anticipo.',batchSource:'EFSA - Cottura sicura dei legumi',dryWeight:'peso secco stimato',cookedWeight:'peso cotto e scolato',batchTag:'Base preparabile in anticipo',batchRecipeNote:'Se usi legumi secchi, cuocili prima nella sezione In anticipo. Il peso nella ricetta è sempre cotto e scolato.'});
Object.assign(WORDS.en,{batch:'Batch prep',batchTitle:'Cook once, prepare several meals.',batchIntro:'These quantities come from your saved plan. Prepare the bases, divide into portions and freeze those for later days.',batchPrefer:'Favour meals you can prepare ahead',batchPreferNote:'Used for new suggestions; your saved plan stays unchanged.',dryMode:'Use dried pulses, cooked in advance',dryModeNote:'Shopping shows dry weight. Recipes always use cooked pulses: do not add dried pulses directly to the quick dishes.',cannedMode:'With this option, shopping uses tinned pulses at drained weight.',batchPulses:'Pulses for this week',batchDishes:'Dishes and bases to prepare',batchView:'Open batch preparation',dryBuy:'Buy dry (approximately)',cookedNeed:'You need cooked and drained',batchPortions:'150 g portions',yieldNote:'Estimate: 100 g dry gives about 250 g cooked and drained. Yield varies: shopping rounds up to the next 25 g. Always weigh the cooked result and top up with a little ready-cooked food if short.',prepTime:'Quick recipe times start with cooked pulses. Soaking and boiling are separate preparations that take longer than 30 minutes.',beanTime:'Beans: soak for 8-12 hours; about 60-120 minutes total cooking.',chickpeaTime:'Chickpeas: soak for 8-12 hours; about 60-120 minutes total cooking.',lentilTime:'Whole lentils: follow the packet for soaking; about 30-45 minutes cooking, until completely soft.',pulseMethod:'How to cook dried pulses',pulseSteps:['Check the pulses for small stones and rinse. Soak beans and chickpeas in plenty of water in the fridge for 8-12 hours. For whole lentils, follow the packet.','Discard the soaking water and rinse. Put each type in a separate saucepan with fresh water covering it by at least 5 cm.','Bring to the boil and keep at a proper boil for at least 30 minutes, topping up with hot water as needed. This step is essential for kidney beans: do not use low-temperature slow cooking alone.','Continue cooking until completely soft and easy to mash with a fork; follow the packet if it requires longer. Only add tomato after cooking.','Drain and weigh. Divide into shallow containers of 150 g or the quantities in the recipes. Label with name, weight and date, cool quickly and store as below.'],batchStorage:'Fridge, freezer and reheating',batchStorageText:'Refrigerate within 2 hours, sooner in hot weather. Keep only the portions for the next 48 hours at 4°C or below; freeze the others promptly, rather than waiting for their day on the menu. Defrost in the fridge and use within 24 hours of fully defrosting. Reheat only once, until hot right through. For beginners, it is simpler to cook rice, pasta and polenta when serving; leftover rice must be cooled within one hour and used within 24 hours if refrigerated.',batchUse:'These portions are used in',batchTotal:'Total portions to prepare',batchIngredients:'Ingredients for all these portions',batchFresh:'Cook when serving',batchEmpty:'Add a pulse dish to the plan to see quantities.',batchNoDishes:'The plan has no dishes or bases marked for preparing ahead.',batchSource:'EFSA - Cooking pulses safely',dryWeight:'estimated dry weight',cookedWeight:'cooked and drained weight',batchTag:'Base can be prepared ahead',batchRecipeNote:'If using dried pulses, cook them first using Batch prep. Recipe quantities always mean cooked and drained weight.'});
function dryQuantity(cooked){return Math.ceil((cooked/2.5)/25)*25;}
function foodName(k){return PULSES.includes(k)&&state.dryPulses?L(PULSE_NAMES[k].c):L(FOOD[k].n);}
function shoppingName(k){return PULSES.includes(k)&&state.dryPulses?L(PULSE_NAMES[k].d):L(FOOD[k].n);}
function cookingStep(pair){let text=L(pair);if(!state.dryPulses)return text;return state.lang==='it'?text.replace(/Scola e sciacqua (?:i|le) (?:legumi|fagioli|ceci|lenticchie)(?: in un colino)?\./gi,'Pesa i legumi già cotti e scolati.'):text.replace(/Drain and rinse (?:the )?(?:pulses|beans|chickpeas|lentils)(?: in a colander)?\./gi,'Weigh the cooked, drained pulses.');}
function pulseNeeds(){const result={};for(const day of plan())for(const m of MEALS){const r=getR(day[m]);if(r)for(const[k,q]of r.items)if(PULSES.includes(k))result[k]=(result[k]||0)+q*state.people;}return result;}
function batchUsage(){const result={};plan().forEach((day,i)=>MEALS.forEach(m=>{const r=getR(day[m]);if(r&&BATCHABLE[r.id]){if(!result[r.id])result[r.id]={r,uses:[]};result[r.id].uses.push({day:i,meal:m});}}));return Object.values(result);}
function batchSettings(){return `<div class="aside-box white no-print" style="margin-bottom:20px"><label class="check-row"><input type="checkbox" id="preferBatch" ${state.preferBatch?'checked':''}><span>${W().batchPrefer}</span></label><p class="smalltext muted">${W().batchPreferNote}</p><label class="check-row"><input type="checkbox" id="dryPulses" ${state.dryPulses?'checked':''}><span>${W().dryMode}</span></label><p class="smalltext muted" style="margin-bottom:0">${state.dryPulses?W().dryModeNote:W().cannedMode}</p></div>`;}
function bindBatchSettings(){for(const[id,key]of [['preferBatch','preferBatch'],['dryPulses','dryPulses']])if($('#'+id))$('#'+id).onchange=e=>{state[key]=e.target.checked;checked.clear();save();render();};}
function batchText(){const needs=pulseNeeds();return W().brand+' · '+W().batch+'\n'+weekLabel()+' · '+state.people+' '+personLabel()+'\n\n'+(state.dryPulses?W().dryModeNote:W().cannedMode)+'\n\n'+Object.entries(needs).map(([k,q])=>L(PULSE_NAMES[k].c)+': '+q+' g '+W().cookedWeight+(state.dryPulses?' / '+dryQuantity(q)+' g '+W().dryWeight:'')).join('\n')+'\n\n'+W().yieldNote+'\n'+W().prepTime+'\n\n'+W().pulseMethod+'\n'+W().pulseSteps.map((s,i)=>(i+1)+'. '+s).join('\n')+'\n'+W().beanTime+'\n'+W().chickpeaTime+'\n'+W().lentilTime+'\n\n'+W().batchDishes+'\n\n'+batchUsage().map(({r,uses})=>L(r.n)+' · '+uses.length*state.people+' '+personLabel(uses.length*state.people)+'\n'+L(BATCHABLE[r.id])+'\n'+W().batchUse+': '+uses.map(u=>fmtDate(u.day)+' '+W()[u.meal]).join('; ')+'\n'+ingredientsText(r,uses.length*state.people).join('\n')).join('\n\n')+'\n\n'+W().batchStorage+'\n'+W().batchStorageText;}
function renderBatch(){const needs=pulseNeeds();$('#batch').innerHTML=`<h2 class="print-title">${W().brand} · ${W().batch} · ${weekLabel()} · ${state.people} ${personLabel()}</h2><div class="toolbar"><h2>${W().batchTitle}</h2><div class="row"><button class="small" data-export="batch-txt">${W().txt}</button><button class="small" data-export="batch-print">${W().print}</button><button class="small" data-export="batch-share">${W().share}</button></div></div><p>${weekLabel()} · ${state.people} ${personLabel()}</p><p class="muted">${W().batchIntro}</p>${batchSettings()}<h3>${W().batchPulses}</h3><div class="recipes">${Object.entries(needs).map(([k,q])=>`<article class="recipe-card"><span class="tag">${q/150} ${W().batchPortions}</span><h3>${L(PULSE_NAMES[k].c)}</h3><p>${W().cookedNeed}: <strong>${q} g</strong>${state.dryPulses?`<br>${W().dryBuy}: <strong>${dryQuantity(q)} g</strong>`:''}</p></article>`).join('')||`<p>${W().batchEmpty}</p>`}</div><p class="smalltext muted">${W().yieldNote}</p><p class="notice">${W().prepTime}</p><div class="shopping-group"><h3>${W().pulseMethod}</h3><ol>${W().pulseSteps.map(s=>'<li style="margin-bottom:12px">'+s+'</li>').join('')}</ol><p>${W().beanTime}<br>${W().chickpeaTime}<br>${W().lentilTime}</p></div><div class="notice"><strong>${W().batchStorage}</strong><br>${W().batchStorageText}</div><h3>${W().batchDishes}</h3>${batchUsage().map(({r,uses})=>`<details class="shopping-group"><summary style="cursor:pointer"><strong>${L(r.n)}</strong> · ${uses.length*state.people} ${personLabel(uses.length*state.people)}</summary><p style="margin-top:15px">${L(BATCHABLE[r.id])}</p><p class="smalltext">${W().batchUse}: ${uses.map(u=>fmtDate(u.day)+' · '+W()[u.meal]).join('; ')}</p><p><strong>${W().batchIngredients}</strong></p><ul>${ingredientsText(r,uses.length*state.people).map(i=>'<li>'+i+'</li>').join('')}</ul><button class="small no-print" data-open="${r.id}">${W().open}</button></details>`).join('')||'<p>'+W().batchNoDishes+'</p>'}<p class="smalltext"><a href="https://www.efsa.europa.eu/en/news/lectins-food-undercooked-beans-pose-health-risk-says-efsa" target="_blank" rel="noopener">${W().batchSource}</a> · <a href="https://www.gov.uk/government/publications/how-to-chill-freeze-and-defrost-food-safely/how-to-chill-freeze-and-defrost-food-safely" target="_blank" rel="noopener">${W().batchStorage}</a></p>`;bindBatchSettings();bindExport();bindOpen();}

function plain(v,max=600){return typeof v==='string'&&v.trim().length>0&&v.length<=max&&!/[<>]/.test(v);}
function validPair(v,optional=false){return Array.isArray(v)&&v.length===2&&v.every(x=>optional&&x===''||plain(x));}
function validateLibrary(lib={foods:{},recipes:[]}){
 if(!lib||typeof lib!=='object'||!lib.foods||typeof lib.foods!=='object'||Array.isArray(lib.foods)||!Array.isArray(lib.recipes)||Object.keys(lib.foods).length>300||lib.recipes.length>300)throw Error('Invalid library');
 const foodKeys=new Set(BASE_FOOD_KEYS);for(const[k,f]of Object.entries(lib.foods)){if(!/^own-[a-z0-9-]{5,60}$/.test(k)||!validPair(f.n)||!['produce','chilled','frozen','cupboard','pantry'].includes(f.g)||!['g','ml','piece'].includes(f.u)||!Array.isArray(f.a)||!f.a.every(a=>['gluten','milk','eggs','fish'].includes(a)))throw Error('Invalid ingredient');foodKeys.add(k);}
 const ids=new Set(BASE_RECIPE_IDS);for(const r of lib.recipes){if(!r||!/^own-[a-z0-9-]{5,60}$/.test(r.id)||ids.has(r.id)||!validPair(r.n)||!validPair(r.equipment)||!validPair(r.note,true)||!['main','colazione'].includes(r.meal)||!['legumes','fish','meat','dairy','eggs','vegetable'].includes(r.family)||!Number.isInteger(r.time)||r.time<1||r.time>360||!Array.isArray(r.seasons)||r.seasons.length<1||!r.seasons.every(s=>ALL.includes(s))||!Array.isArray(r.steps)||r.steps.length<1||r.steps.length>5||!r.steps.every(s=>validPair(s))||!Array.isArray(r.items)||r.items.length<1||r.items.length>30||!r.items.every(i=>Array.isArray(i)&&i.length===2&&foodKeys.has(i[0])&&Number.isFinite(i[1])&&i[1]>0&&i[1]<=10000))throw Error('Invalid recipe');if(r.batchable&&!validPair(r.batchNote))throw Error('Invalid batch note');ids.add(r.id);}
 return lib;
}
function applyLibrary(){for(const k of Object.keys(FOOD))if(!BASE_FOOD_KEYS.includes(k))delete FOOD[k];for(let i=RECIPES.length-1;i>=0;i--)if(!BASE_RECIPE_IDS.includes(RECIPES[i].id))RECIPES.splice(i,1);Object.assign(FOOD,state.library.foods);RECIPES.push(...state.library.recipes);for(const id of Object.keys(BATCHABLE))if(!BASE_RECIPE_IDS.includes(id))delete BATCHABLE[id];for(const r of state.library.recipes)if(r.batchable)BATCHABLE[r.id]=r.batchNote;}
function ownId(){return 'own-'+(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));}
function renderLibrary(){$('#library').innerHTML=`<div class="sources"><p class="eyebrow">${W().library}</p><h2>${W().libraryTitle}</h2><p>${W().libraryIntro}</p><div class="row"><button class="primary" id="newFood">${W().addIngredient}</button><button id="newRecipe">${W().addOwnRecipe}</button></div><p class="smalltext muted" style="margin-top:14px">${W().saveBackupHint}</p><h3>${W().ownRecipes}</h3>${state.library.recipes.length?state.library.recipes.map(r=>`<div class="shopping-group"><strong>${L(r.n)}</strong><div class="row" style="margin-top:10px"><button class="small" data-open="${r.id}">${W().open}</button><button class="small" data-edit-recipe="${r.id}">${W().editOwn}</button></div></div>`).join(''):'<p class="muted">'+W().nothingOwn+'</p>'}<h3>${W().ownIngredients}</h3>${Object.entries(state.library.foods).length?Object.entries(state.library.foods).map(([k,f])=>`<div class="shopping-group"><strong>${L(f.n)}</strong> · ${W()[f.g]} · ${f.u==='piece'?W().piece:f.u}<br><button class="small" style="margin-top:8px" data-edit-food="${k}">${W().editOwn}</button></div>`).join(''):'<p class="muted">'+W().nothingOwn+'</p>'}</div>`;$('#newFood').onclick=()=>editFood();$('#newRecipe').onclick=()=>editRecipe();$$('[data-edit-food]').forEach(b=>b.onclick=()=>editFood(b.dataset.editFood));$$('[data-edit-recipe]').forEach(b=>b.onclick=()=>editRecipe(b.dataset.editRecipe));bindOpen();}
function editorShell(title,body){const d=$('#recipeDialog');d.innerHTML=`<div class="dialog-head"><h2 id="recipeTitle" style="font-size:25px;margin:0">${title}</h2><button id="closeEditor" class="small" aria-label="${W().close}">✕</button></div><div class="dialog-content"><form id="ownForm">${body}<p id="ownError" class="notice" role="alert" hidden></p><button class="primary" type="submit" style="margin-top:18px">${W().saveOwn}</button></form></div>`;$('#closeEditor').onclick=()=>d.close();if(!d.open)d.showModal();return $('#ownForm');}
function field(id,label,value='',type='text'){return `<label style="display:grid;gap:6px;margin:14px 0"><span>${label}</span><input id="${id}" type="${type}" value="${escapeHTML(value)}" required ${type==='number'?'min="1" max="360" step="1"':'maxlength="200"'}></label>`;}

function editFood(id){const f=id?state.library.foods[id]:{n:['',''],g:'produce',u:'g',a:[]};const form=editorShell(W().addIngredient,field('foodIt',W().nameIt,f.n[0])+field('foodEn',W().nameEn,f.n[1])+`<label>${W().group}<select id="foodGroup">${['produce','chilled','frozen','cupboard','pantry'].map(g=>`<option value="${g}" ${g===f.g?'selected':''}>${W()[g]}</option>`).join('')}</select></label> <label>${W().unit}<select id="foodUnit">${['g','ml','piece'].map(u=>`<option value="${u}" ${u===f.u?'selected':''}>${u==='piece'?W().piece:u}</option>`).join('')}</select></label><p style="margin-top:18px">${W().allergensOwn}</p>${['gluten','milk','eggs','fish'].map(a=>`<label class="check-row"><input type="checkbox" data-allergen="${a}" ${f.a.includes(a)?'checked':''}><span>${W()[a]}</span></label>`).join('')}`);form.onsubmit=e=>{e.preventDefault();const key=id||ownId();const food={n:[$('#foodIt').value.trim(),$('#foodEn').value.trim()],g:$('#foodGroup').value,u:$('#foodUnit').value,a:$$('[data-allergen]').filter(c=>c.checked).map(c=>c.dataset.allergen)};try{const next={foods:{...state.library.foods,[key]:food},recipes:state.library.recipes};validateLibrary(next);state.library=next;applyLibrary();save();$('#recipeDialog').close();renderLibrary();toast(W().ownSaved);}catch(err){formError();}};}

 const form=editorShell(W().addOwnRecipe,`<p class="smalltext muted">${W().ownRecipeNote} ${W().newFoodNote}</p>`+field('ownIt',W().nameIt,r.n[0])+field('ownEn',W().nameEn,r.n[1])+field('ownTime',W().timeOwn,r.time,'number')+`<div class="row"><label>${W().pickMeal}<select id="ownMeal">${['main','colazione'].map(m=>`<option value="${m}" ${r.meal===m?'selected':''}>${W()[m]}</option>`).join('')}</select></label><label>${W().family}<select id="ownFamily">${['legumes','fish','meat','dairy','eggs','vegetable'].map(f=>`<option value="${f}" ${r.family===f?'selected':''}>${W()[f]}</option>`).join('')}</select></label></div><p style="margin-top:18px">${W().seasonsOwn}</p><div class="row">${ALL.map(s=>`<label class="check-row"><input type="checkbox" data-own-season="${s}" ${r.seasons.includes(s)?'checked':''}><span>${W()[s]}</span></label>`).join('')}</div>`+field('ownEquipIt',W().equipmentIt,r.equipment[0])+field('ownEquipEn',W().equipmentEn,r.equipment[1])+`<h3>${W().ingredients}</h3><div id="ownItems"></div><button type="button" class="small" id="addOwnRow">${W().addRow}</button><label style="display:grid;gap:6px;margin:18px 0">${W().stepsIt}<textarea id="stepsIt" rows="6" maxlength="3000" required>${escapeHTML(r.steps.map(s=>s[0]).join('\n'))}</textarea></label><label style="display:grid;gap:6px;margin:18px 0">${W().stepsEn}<textarea id="stepsEn" rows="6" maxlength="3000" required>${escapeHTML(r.steps.map(s=>s[1]).join('\n'))}</textarea></label><label style="display:grid;margin:15px 0">${W().noteIt}<textarea id="ownNoteIt" rows="2" maxlength="600">${escapeHTML(r.note[0])}</textarea></label><label style="display:grid;margin:15px 0">${W().noteEn}<textarea id="ownNoteEn" rows="2" maxlength="600">${escapeHTML(r.note[1])}</textarea></label><label class="check-row"><input type="checkbox" id="ownBatch" ${r.batchable?'checked':''}><span>${W().ownBatch}</span></label><label style="display:grid;margin:15px 0">${W().ownBatchIt}<textarea id="batchNoteIt" rows="2" maxlength="600">${escapeHTML(r.batchNote?.[0]||'')}</textarea></label><label style="display:grid;margin:15px 0">${W().ownBatchEn}<textarea id="batchNoteEn" rows="2" maxlength="600">${escapeHTML(r.batchNote?.[1]||'')}</textarea></label>`);
 function draw(){ $('#ownItems').innerHTML=items.map(([key,q],i)=>`<div class="own-item-row" style="display:flex;gap:8px;margin-bottom:12px;align-items:center"><select data-item-index="${i}" style="flex:1;min-width:0" aria-label="${W().ingredientRow} ${i+1}">${Object.keys(FOOD).sort((a,b)=>foodName(a).localeCompare(foodName(b),state.lang)).map(k=>`<option value="${k}" ${key===k?'selected':''}>${foodName(k)}</option>`).join('')}</select><input data-qty-index="${i}" type="number" min="0.1" max="10000" step="any" value="${q}" required aria-label="${W().quantity} ${i+1}" style="width:90px"><span class="smalltext">${FOOD[key].u==='piece'?W().piece:FOOD[key].u||'g'}</span><button type="button" class="small" data-remove-index="${i}" aria-label="${W().deleteRow} ${i+1}">✕</button></div>`).join('');$$('[data-item-index]').forEach(c=>c.onchange=()=>{items[Number(c.dataset.itemIndex)][0]=c.value;draw();});$$('[data-qty-index]').forEach(c=>c.oninput=()=>{items[Number(c.dataset.qtyIndex)][1]=Number(c.value);});$$('[data-remove-index]').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.removeIndex),1);draw();});}
 draw();$('#addOwnRow').onclick=()=>{if(items.length<30){items.push(['bread',70]);draw();}};form.onsubmit=e=>{e.preventDefault();const a=$('#stepsIt').value.split('\n').map(s=>s.trim()).filter(Boolean),b=$('#stepsEn').value.split('\n').map(s=>s.trim()).filter(Boolean);if(a.length!==b.length){formError();return;}const next={id:id||ownId(),n:[$('#ownIt').value.trim(),$('#ownEn').value.trim()],time:Number($('#ownTime').value),equipment:[$('#ownEquipIt').value.trim(),$('#ownEquipEn').value.trim()],note:[$('#ownNoteIt').value.trim(),$('#ownNoteEn').value.trim()],meal:$('#ownMeal').value,family:$('#ownFamily').value,batchable:$('#ownBatch').checked,batchNote:[$('#batchNoteIt').value.trim(),$('#batchNoteEn').value.trim()],seasons:$$('[data-own-season]').filter(c=>c.checked).map(c=>c.dataset.ownSeason),items:items.map(i=>[...i]),steps:a.map((s,i)=>[s,b[i]])};try{const lib={foods:state.library.foods,recipes:[...state.library.recipes.filter(r=>r.id!==next.id),next]};validateLibrary(lib);state.library=lib;applyLibrary();save();$('#recipeDialog').close();tab='library';render();toast(W().ownSaved);}catch(err){formError();}};
}
